name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy python-dotenv
      - name: Compile Python sources
        run: python -m compileall -q main.py legacy_main.py birdwatcher birdwatcher_improved.py scripts
      - name: Run unit and integration tests
        run: python -m unittest -v

  runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile production runtime
        run: python -m compileall -q main.py birdwatcher birdwatcher_improved.py scripts
      - name: Check compatibility launchers
        run: python -c "import legacy_main; import birdwatcher_improved"
      - name: Prove production runtime is independent of legacy_main
        run: |
          mv legacy_main.py /tmp/legacy_main.py
          python scripts/runtime_smoke.py
