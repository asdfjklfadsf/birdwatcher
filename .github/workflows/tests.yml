name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy python-dotenv
      - name: Compile Python sources
        run: python -m compileall -q main.py legacy_main.py birdwatcher birdwatcher_improved.py
      - name: Run unit and integration tests
        run: python -m unittest -v
